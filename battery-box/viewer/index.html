<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4Runner Card Cage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D canvas; two floating workshop-tag panels (controls top-left, legend + numbers top-right) that stack on phones. */
  :root {
    --bg: #e9edf1;          /* cool shop-floor gray, slight blue bias */
    --fg: #16202b;
    --muted: #5d6b7a;
    --panel: #f7f9fbd9;
    --line: #c9d2db;
    --accent: #1d4ed8;      /* Victron-ish blue */
    --print: #d9541f;       /* printed-part orange, same as the renders */
    --font-ui: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12171d; --fg: #e6ebf0; --muted: #96a3b1; --panel: #1b222ad9; --line: #2e3842; --accent: #6b9bff; --print: #ff7a3d; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #12171d; --fg: #e6ebf0; --muted: #96a3b1; --panel: #1b222ad9; --line: #2e3842; --accent: #6b9bff; --print: #ff7a3d; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui); }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; padding: 12px 16px 0; display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .panel { background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; pointer-events: auto; min-width: 0; }
  #controls { max-width: 340px; }
  #side { max-width: 300px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button, select { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
  button.primary { border-color: var(--accent); color: var(--accent); font-weight: 500; }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 2px 0; cursor: pointer; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid #0003; flex: none; }
  #legend { display: grid; grid-template-columns: 1fr; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 10px 0 4px; }
  .eyebrow:first-child { margin-top: 0; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12.5px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  #status { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; font-size: 12px; color: var(--muted); font-family: var(--font-num); }
  @media (max-width: 700px) {
    #hud { flex-direction: column; }
    #controls, #side { max-width: none; width: auto; }
    #side details:not([open]) summary { margin: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="panel" id="controls">
    <h1>4Runner card cage</h1>
    <div class="muted" id="blurb">Drag to orbit, scroll to zoom. Lid hidden; uncheck panels to see inside.</div>
    <div class="row" style="align-items:center">
      <label for="variant" style="margin:0">Version</label>
      <select id="variant">
        <option value="v9">v9 · 353 wide × 568 deep: four batteries, bus deck, two cards</option>
        <option value="v10">v10 · 365 wide × 454 deep: two batteries + add-on pack, side ports</option>
        <option value="v11">v11 · 386 wide × 438 deep: v10 swapped, MultiPlus in the column</option>
        <option value="v8">v8 · 345 wide × 598 deep: 4 × SuperPack 60Ah, three cards across (like v4)</option>
        <option value="v7">v7 · 345 wide × 642 deep: 4 × SuperPack 60Ah, lengthwise printed cards</option>
        <option value="bookshelf">v6 · side-mount cards, MultiPlus 12/1200, 4 × 200Ah (2 × 2)</option>
        <option value="bookshelf2">v6 alt · same, 2 × 200Ah end to end</option>
        <option value="bookshelf60">v6 check · your 4 × SuperPack 60Ah in the 200Ah trays</option>
        <option value="icebox">v5 · second IceBox 1.3 frame (762 deep, 559 tall)</option>
        <option value="cube">v4 · 487 mm cube, 12 uncut kit bars</option>
      </select>
    </div>
    <div class="row">
      <button data-view="iso">Iso</button><button data-view="front">Front</button><button data-view="inboard">Inboard</button><button data-view="top">Top</button><button data-view="back">IceBox side</button>
      <button id="card" class="primary">Lift cards</button>
      <label style="margin:0 0 0 4px"><input type="checkbox" id="dims" checked> Dimensions</label>
    </div>
  </div>
  <div class="panel" id="side">
    <details open>
      <summary class="eyebrow" style="cursor:pointer">Legend</summary>
      <div id="legend"></div>
    </details>
    <div class="eyebrow" id="numbers-title">Cube frame, 12 uncut kit bars</div>
    <dl id="numbers"></dl>
  </div>
</div>
<div id="status">Loading model…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');

applyBg(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyBg);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x6f7a86, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(600, 900, 1200); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-800, 400, -600); scene.add(fill);

// name prefix -> [label, colour, opacity]
const GROUPS = {
  icebox:   ['IceBox 1.3 (reference)',      0x7a7f86, 0.45],
  bar:      ['Kit extrusion bars (12, uncut)', 0xb8bcc2, 1],
  print:    ['Printed: cubes, splices, guide posts, tray', 0xd9541f, 1],
  panel:    ['6 mm panels, bulkhead',       0x2a2a2a, 0.3],
  lid:      ['Lid',                         0x2a2a2a, 0.25],
  card:     ['Cards: distribution · inverter/charger · upper', 0x3a3a3a, 0.95],
  victron:  ['Victron units',               0x2563eb, 1],
  battery:  ['Batteries',                   0x3b82f6, 0.9],
  garmin:   ['Garmin PowerSwitch',          0x111111, 1],
  power:    ['Bus bars, breakers, shunt',   0xc9a227, 1],
  socket:   ['Sockets + Anderson SB50s',    0x444444, 1],
};
const legend = document.getElementById('legend');
const groupObjs = {};
for (const [k, [label, col]] of Object.entries(GROUPS)) {

  const l = document.createElement('label');
  const id = 'g-' + k;
  l.innerHTML = `<input type="checkbox" id="${id}" checked data-g="${k}"><span class="sw" style="background:#${col.toString(16).padStart(6,'0')}"></span>${label}`;

  legend.appendChild(l);
}

const BUILD = '20261007205337';   // bumped on every publish so browsers never reuse a cached model
const VARIANTS = {
  cube: { title: 'Cube frame, 12 uncut kit bars', blurb: 'v4: a 487 mm cube from 12 uncut kit bars, 71 mm lower than the IceBox. Drag to orbit, scroll to zoom. Lid hidden; uncheck panels to see inside.',
    rows: [['Outer', '487 × 487 × 487 mm'], ['vs IceBox', 'same width, 71 mm lower'], ['Distribution card', '419 × 423: MPPT · Cerbo · Garmin · bus'], ['Inverter/charger card', '419 × 254, MultiPlus 12/800'], ['Upper card', '419 × 171, Orion'], ['Battery bay', '4 × SuperPack: 3 up, 1 on side'], ['Lift', '910 / 741 / 658 mm']] },
  v11: { title: 'v11: swapped, MultiPlus in the column', blurb: 'v11: v10 with the cards swapped. The MultiPlus stands lengthwise in the column beside the battery stack (card, feet, 101 mm body and 30 mm behind it for its SB175 fit the 163 mm column with 16 to spare); the MPPT, Orion, Cerbo, Garmin and shunt are the front card, which is 70 mm deep instead of 101. 438 mm deep, 17.2 in, right at the 17.25 in limit. Ports on the pedal-side wall beside the front card. Drag to orbit, scroll to zoom.',
    rows: [['Outer', '438 × 386 × 559 mm (17.2 in deep, the 17.25 in limit; 15.2 in wide)'], ['vs v10', '16 mm shorter: the front card is the MPPT\'s 70, not the MultiPlus\'s 101; 7 mm of the gain spent on wiring room'], ['Column', '184 mm: MultiPlus flush on a 264 × 444 lengthwise card (2 × 2 tiles), 47 mm off the batteries; its SB175 on the card\'s rear face, mating up'], ['Column floor', 'a continuous full-width floor from the tray wall to the inverter card\'s posts, two halves bolted at both ends, ties the tray to the frame on all four sides'], ['Deck', '30 mm over the batteries (4 AWG lug room), no windows; four plates on common lines; the extension screws into ledges that are part of the column posts and into cleats under the joint; unbolt it to lift the inverter card'], ['Front card', '249 × 444: MPPT top, Orion + Cerbo middle, Garmin + shunt bottom; 5 SB50 rear, PP45 front'], ['Ports', 'one vertical column on the front face in the 78 mm strip beside the front card: SB175 pack inlet, 3 × 12 V, 2 × USB, 2 × SB50, 2 × L14-30; orientation-independent'], ['Pedal room', '102 mm (4.0 in) inside the IceBox face']] },
  v10: { title: 'v10: two batteries, 454 deep', blurb: 'v10: two SuperPacks in one stack; the charge card turns lengthwise into the freed column along the inboard wall (units facing the stack, SB50s on its rear face), the inverter card sits 10 mm in front of the bay and every port is on the pedal-side wall beside it, backs toward the inverter. 454 mm deep, 17.9 in. Drag to orbit, scroll to zoom.',
    rows: [['Outer', '454 × 365 × 559 mm (17.9 in deep, 12 mm wider than v9 for the side ports)'], ['vs v9', '114 mm shorter, 15 kg lighter, half the bank'], ['Bank', '120 Ah · 60 A continuous · MultiPlus limited to ~700 W continuous'], ['Column card', '250 × 444 along the inboard wall: MPPT · Orion · Garmin · Cerbo · shunt; 5 SB50 + PP45 on its rear face'], ['Deck', '245 × 151 over the stack: bus bars, breakers, hand window'], ['Ports', 'on the pedal-side wall beside the inverter, backs toward it: 2 × L14-30, 2 × SB50, 3 × 12 V, 2 × USB, SB175 pack inlet'], ['Pedal room', '123 mm (4.8 in) inside the IceBox face at 365 wide (v9: 134 mm / 5.3 in at 353)'], ['Add-on pack', '325 × 314 × 312, all printed: 30 mm corner posts on the tray pads, 6 mm panel tiles, one Blue Sea 187 150 A breaker, SB175 to the main box']] },
  v9: { title: 'v9: bus deck, cards unplug', blurb: 'v9: the bus bars, breakers and shunt move to a fixed printed deck on top of the battery rack, with Anderson receptacles at its front edge. Two cards remain (inverter; MPPT + Orion + Cerbo + Garmin), each with its pigtails ending in a connector at its top rear corner, so any card unplugs at the deck and lifts out alone. Drag to orbit, scroll to zoom.',
    rows: [['Outer', '568 × 353 × 559 mm (22.4 in deep)'], ['vs IceBox', '5.3 in narrower, 7.6 in shorter in depth, same height'], ['Wiring room', '20 mm deck-to-inverter card (SB175 housing + 4) · pigtails lugged at the deck, charge-card ones in the 18 mm outboard chase · 60 mm under the lid for the cable bends'], ['Bus deck', 'at 468 mm on the rack legs, 91 mm under the lid'], ['Cards', '2 × 277 wide × 444 tall, solid printed tiles (50 mm cut down for wire room)'], ['Connectors', 'SB175 / SB50 halves at the top of each card\'s rear face (face up), PP45 for the Garmin on the front face, deck halves face forward'], ['Bank', '240 Ah · 3.1 kWh · 120 A'], ['Mass', '~58 kg']] },
  v8: { title: 'v8: three cards across', blurb: 'v8: v7\'s battery bay (four SuperPack 60Ah, two touching stacks on the plate) with three printed cards facing across the box like v4: the inverter card (MultiPlus 12/1200 upright + shunt), the charge card (MPPT, Orion, Cerbo, Garmin) and the distribution card (bus bars, breakers). Sockets in the front panel\'s lower band. Drag to orbit, scroll to zoom.',
    rows: [['Outer', '598 × 345 × 559 mm'], ['vs IceBox', '5.6 in narrower, 6.5 in shorter in depth, same height'], ['Battery bay', '2 stacks × 146 = 294 wide, 261 deep, 468 tall'], ['Cards', '3 × 277 wide × 494 tall, printed 2 × 2 solid tiles'], ['Depth chain', 'bay 261 · 10 · inverter 124 · charge 84 · dist 60 · 8'], ['Bank', '240 Ah · 3.1 kWh · 120 A'], ['Mass', '~60 kg']] },
  v7: { title: 'v7: narrow and short, your 60Ah batteries', blurb: 'v7: your four SuperPack 60Ah in two touching stacks at the IceBox end on the plate; kit-bar cross-members at the bay front; the inverter/charger card (MultiPlus 12/1200 upright) and the distribution card (bus, shunt, breakers, MPPT, Orion, Cerbo, Garmin) lengthwise in front, with the port wall brought in to the gear. Cards are printed ribbed tiles. Drag to orbit, scroll to zoom.',
    rows: [['Outer', '642 × 345 × 559 mm'], ['vs IceBox', '5.6 in narrower, 4.7 in shorter in depth, same height'], ['Battery bay', '2 stacks × 146 = 294 wide, 261 deep, 468 tall'], ['Cards', '281 × 494, printed 2 × 2 solid tiles, lengthwise'], ['Inverter', 'MultiPlus 12/1200 upright, terminals down'], ['Bank', '240 Ah · 3.1 kWh · 120 A'], ['Mass', '~61 kg']] },
  bookshelf: { title: 'v6: side-mount cards, 4 × 200Ah', blurb: 'v6: a second 30" IceBox 1.3 frame with the inverter/charger and distribution cards running front to back along the inboard wall; your MultiPlus 12/1200 on its side; four Lithium Smart 200Ah in a 2 × 2 printed rack standing on the Goose Gear plate. Real Victron geometry. Drag to orbit, scroll to zoom. Lid hidden; uncheck panels to see inside.',
    rows: [['Outer', '438 × 762 × 559 mm (50 mm narrower than the IceBox)'], ['Inverter/charger card', '694 × 494: MultiPlus 12/1200 + MPPT + Orion + Cerbo'], ['Distribution card', '694 × 494: bus · shunt · breakers · BMS · Garmin'], ['Battery column', '193 wide: 2 × 2 Lithium Smart 200Ah, rack on the plate'], ['Bank', '800 Ah · 10.2 kWh · 800 A rec'], ['Mass', '~115 kg']] },
  bookshelf60: { title: 'v6 check: SuperPack 60Ah in the 200Ah trays', blurb: 'Your four SuperPack 60Ah dropped into the 200Ah trays of the 2 × 2 rack: they fit with 92 mm of slack in length and 14 mm in width, so they need printed spacer blocks. Drag to orbit, scroll to zoom.',
    rows: [['Outer', '438 × 762 × 559 mm (narrow frame)'], ['Inverter/charger card', '694 × 494: MultiPlus 12/1200 + MPPT + Orion + Cerbo'], ['Distribution card', '694 × 494: bus · shunt · breakers · BMS · Garmin'], ['Battery column', '191 wide: 2 × 2 SuperPack 60Ah in 200Ah trays'], ['Bank', '240 Ah · 3.1 kWh · 120 A rec'], ['Mass', '~65 kg']] },
  bookshelf2: { title: 'v6 alt: two 200Ah end to end', blurb: 'v6 with two Lithium Smart 200Ah end to end on the plate, no rack. Same cards, same MultiPlus 12/1200. Drag to orbit, scroll to zoom.',
    rows: [['Outer', '438 × 762 × 559 mm (narrow frame)'], ['Inverter/charger card', '694 × 494: MultiPlus 12/1200 + MPPT + Orion + Cerbo'], ['Distribution card', '694 × 494: bus · shunt · breakers · BMS · Garmin'], ['Battery column', '193 wide: 2 × Lithium Smart 200Ah end to end'], ['Bank', '400 Ah · 5.1 kWh · 400 A rec'], ['Mass', '~75 kg']] },
  icebox: { title: 'Second IceBox 1.3 frame', blurb: 'v5: a second 30" IceBox 1.3 frame with the fridge slide removed, decks flush. Drag to orbit, scroll to zoom. Lid hidden; uncheck panels to see inside.',
    rows: [['Outer', '762 × 487 × 559 mm (30" IceBox)'], ['vs IceBox', 'identical, decks flush'], ['Distribution card', '419 × 494: MPPT · Cerbo · Garmin · bus'], ['Inverter/charger card', '419 × 254, MultiPlus 12/800'], ['Upper card', '419 × 242, Orion'], ['Battery bay', '2 stacks at the walls, 145 mm channel'], ['Lift', '1053 / 813 / 801 mm']] },
};
let bbox = new THREE.Box3(); let cardRoot = null, cardLifted = false, modelRoot = null, dimRoot = null;
// model (x, y, z) -> three (x, z, -y)
const M = p => new THREE.Vector3(p[0], p[2], -p[1]);
function labelSprite(text) {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  ctx.font = '600 28px "IBM Plex Mono", Menlo, monospace'; const w = ctx.measureText(text).width + 24;
  c.width = Math.ceil(w); c.height = 44; const ctx2 = c.getContext('2d');
  ctx2.font = '600 28px "IBM Plex Mono", Menlo, monospace';
  ctx2.fillStyle = isDark() ? 'rgba(27,34,42,0.92)' : 'rgba(255,255,255,0.92)'; ctx2.fillRect(0, 0, c.width, c.height);
  ctx2.fillStyle = isDark() ? '#ffb07a' : '#b3410f'; ctx2.textBaseline = 'middle'; ctx2.fillText(text, 12, 22);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  sp.scale.set(c.width * 0.55, c.height * 0.55, 1); sp.renderOrder = 10; return sp;
}
async function loadDims(variant) {
  if (dimRoot) { scene.remove(dimRoot); dimRoot = null; }
  let dims; try { dims = await (await fetch(`dims-${variant}.json?v=${BUILD}`, { cache: 'no-store' })).json(); } catch { return; }
  dimRoot = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color: isDark() ? 0xffb07a : 0xb3410f, depthTest: false, transparent: true });
  for (const d of dims) {
    const a = M(d.a), b = M(d.b), off = M(d.off);
    const a2 = a.clone().add(off), b2 = b.clone().add(off);
    const pts = [a, a2, a2, b2, b2, b];                        // extension lines + dimension line
    const tick = a2.clone().sub(b2).normalize().cross(new THREE.Vector3(0, 1, 0)).multiplyScalar(6);
    if (tick.length() < 1) tick.set(6, 0, 0);
    pts.push(a2.clone().add(tick), a2.clone().sub(tick), b2.clone().add(tick), b2.clone().sub(tick));
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.LineSegments(geo, mat); line.renderOrder = 9; dimRoot.add(line);
    const sp = labelSprite(d.label); sp.position.copy(a2.clone().add(b2).multiplyScalar(0.5)).add(off.clone().normalize().multiplyScalar(14)); dimRoot.add(sp);
  }
  dimRoot.visible = document.getElementById('dims').checked;
  scene.add(dimRoot);
}
document.getElementById('dims').addEventListener('change', e => { if (dimRoot) dimRoot.visible = e.target.checked; });
function showNumbers(v) {
  const d = VARIANTS[v];
  document.querySelector('h1').textContent = '4Runner card cage · ' + ({ v9: 'v9 bus deck', v8: 'v8 three cards across', v7: 'v7 narrow, 4 × 60Ah', cube: 'v4 cube', icebox: 'v5 second IceBox', bookshelf: 'v6 side-mount, 4 × 200Ah', bookshelf2: 'v6 alt, 2 × 200Ah', bookshelf60: 'v6 check, 4 × 60Ah' })[v];
  document.getElementById('numbers-title').textContent = d.title;
  document.getElementById('blurb').textContent = d.blurb;
  document.getElementById('numbers').innerHTML = d.rows.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('');
}

// The model ships as JSON glTF with its buffer embedded as base64.  Fetching a
// data: URI is blocked in sandboxed hosts, so decode it here and hand the
// loader a GLB built in memory.
async function loadModel(variant) {
  const js = await (await fetch(`cage-${variant}.json?v=${BUILD}`, { cache: 'no-store' })).json();
  const b64 = js.buffers[0].uri.split(',')[1]; delete js.buffers[0].uri;
  const raw = atob(b64); const bin = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  const enc = new TextEncoder().encode(JSON.stringify(js));
  const pad4 = n => (4 - n % 4) % 4;
  const jp = pad4(enc.length), bp = pad4(bin.length);
  const total = 12 + 8 + enc.length + jp + 8 + bin.length + bp;
  const buf = new ArrayBuffer(total); const dv = new DataView(buf); const u8 = new Uint8Array(buf);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true);
  let o = 12;
  dv.setUint32(o, enc.length + jp, true); dv.setUint32(o + 4, 0x4E4F534A, true);
  u8.set(enc, o + 8); u8.fill(0x20, o + 8 + enc.length, o + 8 + enc.length + jp); o += 8 + enc.length + jp;
  dv.setUint32(o, bin.length + bp, true); dv.setUint32(o + 4, 0x004E4942, true); u8.set(bin, o + 8);
  return new Promise((res, rej) => new GLTFLoader().parse(buf, '', res, rej));
}

function setVariant(v) {
  showNumbers(v);
  document.getElementById('status').textContent = 'Loading model…';
  if (modelRoot) { scene.remove(modelRoot); modelRoot = null; }
  if (cardRoot) { scene.remove(cardRoot); cardRoot = null; }
  for (const k in groupObjs) groupObjs[k] = [];
  cardLifted = false; document.getElementById('card').textContent = 'Lift cards';
  loadModel(v).then(gltf => {
  const root = gltf.scene; modelRoot = root;
  root.traverse(o => {
    if (!o.isMesh) return;
    if (!o.geometry.getAttribute('normal')) o.geometry.computeVertexNormals();
    const name = (o.name || o.parent?.name || '').toLowerCase().replace('print_pack_panel', 'panel_pack').replace('print_pack_lid', 'lid_pack');
    const key = Object.keys(GROUPS).find(k => name.startsWith(k)) || 'print';
    const [, col, op] = GROUPS[key];
    o.material = new THREE.MeshStandardMaterial({ color: col, roughness: 0.6, metalness: key === 'bar' ? 0.5 : 0.05,
      transparent: op < 1, opacity: op, depthWrite: op >= 1, side: THREE.DoubleSide });
    o.userData.key = key;
    groupObjs[key].push(o);
  });
  scene.add(root);
  bbox.setFromObject(root);
  cardRoot = new THREE.Group(); scene.add(cardRoot);
  const liftable = [];
  root.traverse(o => { if (o.isMesh && (/__card$/i.test(o.name) || /^card_/i.test(o.name))) liftable.push(o); });
  liftable.forEach(o => cardRoot.attach(o));
  document.getElementById('g-lid').checked = false;
  for (const inp of legend.querySelectorAll('input')) groupObjs[inp.dataset.g].forEach(o => o.visible = inp.checked);
  setView('iso');
  loadDims(v);
  document.getElementById('status').textContent = `${({ v9: 'v9 bus deck', v8: 'v8 three cards across', v7: 'v7 narrow, 4 × 60Ah', cube: 'v4 cube', icebox: 'v5 second IceBox', bookshelf: 'v6 side-mount, 4 × 200Ah', bookshelf2: 'v6 alt, 2 × 200Ah', bookshelf60: 'v6 check, 4 × 60Ah' })[v]} loaded · ${liftable.length} parts ride on the cards · units mm`;
  }).catch(err => { document.getElementById('status').textContent = 'Could not load model: ' + err; });
}
document.getElementById('variant').addEventListener('change', e => setVariant(e.target.value));
setVariant(document.getElementById('variant').value);

function setView(v) {
  const c = bbox.getCenter(new THREE.Vector3()); const s = bbox.getSize(new THREE.Vector3()); const r = s.length() * 0.8;
  // glTF is Y-up: model X = length, Y = up, Z = -width (inboard is +Z after conversion)
  // glTF is Y-up: model X (depth) = X, model Z (up) = Y, model Y (inboard) = -Z
  const d = { iso: [1, 0.6, -0.9], front: [1, 0.15, -0.001], inboard: [0.1, 0.2, -1], top: [0.001, 1, -0.001], back: [-1, 0.25, -0.4] }[v];
  camera.position.set(c.x + d[0] * r, c.y + d[1] * r, c.z + d[2] * r);
  controls.target.copy(c); controls.update();
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.getElementById('card').addEventListener('click', e => {
  cardLifted = !cardLifted; e.target.textContent = cardLifted ? 'Seat cards' : 'Lift cards';
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop() {
  requestAnimationFrame(loop);
  if (cardRoot) {
    const target = cardLifted ? 450 : 0;
    cardRoot.position.y = reduce ? target : cardRoot.position.y + (target - cardRoot.position.y) * 0.08;
  }
  controls.update(); renderer.render(scene, camera);
})();
</script>
</body>
